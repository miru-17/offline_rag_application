# RAGENTIS -- single-machine deployment.
# Secrets come from the .env file next to this file (never commit it).
# Copy .env.example to .env and fill in the values first.
services:
  postgres:
    image: postgres:16
    container_name: ragentis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: offline_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d offline_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: the backend reaches PostgreSQL inside Docker (postgres:5432).
    # This avoids clashes with a PostgreSQL installed on Windows and keeps the
    # database unreachable from outside. For direct access use:
    #   docker exec -it ragentis-postgres psql -U postgres -d offline_rag

  ollama:
    image: ollama/ollama:latest
    container_name: ragentis-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # No host port: the backend reaches Ollama inside Docker (http://ollama:11434).
    # This also avoids a clash with an Ollama app installed on Windows (port 11434).

  backend:
    build: ./backend
    image: ragentis-backend:latest
    container_name: ragentis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # The password is supplied via PGPASSWORD (read by libpq/psycopg2)
      # instead of being embedded in the URL, so special characters such
      # as '@' in the password do not need URL-encoding.
      DATABASE_URL: "postgresql+psycopg2://postgres@postgres:5432/offline_rag"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (at least 32 characters)}"
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
      ALLOW_SELF_REGISTRATION: "${ALLOW_SELF_REGISTRATION:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-false}"
      LLM_MAX_CONCURRENCY: "1"
      INGESTION_CONCURRENCY: "1"
      # Requests arrive through the web container; trust its X-Forwarded-For
      # so audit entries and rate limits see the real client address.
      FORWARDED_ALLOW_IPS: "*"
      OLLAMA_ALLOWED_MODELS: "${OLLAMA_ALLOWED_MODELS:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-all-MiniLM-L6-v2}"
      HYBRID_SEARCH: "${HYBRID_SEARCH:-true}"
      OCR_ENABLED: "${OCR_ENABLED:-true}"
      OCR_LANGUAGES: "${OCR_LANGUAGES:-eng}"
      WATCH_FOLDER: "/app/watch"
      WATCH_OWNER: "${WATCH_OWNER:-}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      MFA_ISSUER: "${MFA_ISSUER:-RAGENTIS}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-14}"
      LDAP_ENABLED: "${LDAP_ENABLED:-false}"
      LDAP_SERVER_URL: "${LDAP_SERVER_URL:-}"
      LDAP_BIND_TEMPLATE: "${LDAP_BIND_TEMPLATE:-}"
      LDAP_SEARCH_BASE: "${LDAP_SEARCH_BASE:-}"
      LDAP_USER_FILTER: "${LDAP_USER_FILTER:-}"
      LDAP_EMAIL_ATTRIBUTE: "${LDAP_EMAIL_ATTRIBUTE:-mail}"
      LDAP_GROUP_ROLE_MAP: "${LDAP_GROUP_ROLE_MAP:-}"
      LDAP_DEFAULT_ROLE: "${LDAP_DEFAULT_ROLE:-}"
    volumes:
      - rag_uploads:/app/uploads
      - rag_chroma:/app/chroma_db
      - rag_reports:/app/reports
      # Watched folder: files copied here are added automatically (read-only for RAGENTIS).
      - "${RAGENTIS_WATCH_DIR:-./watch}:/app/watch:ro"
      # Keeps the downloaded embedding model, so it is fetched only once.
      - hf_cache:/hf_cache
    # Use 0.0.0.0:8000:8000 only when other office computers must connect,
    # and then put HTTPS (reverse proxy) in front of it.
    ports:
      - "127.0.0.1:8000:8000"

  # Web server: the app at https://localhost:8443 and the API under /api.
  web:
    build: ./frontend
    image: ragentis-web:latest
    container_name: ragentis-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      RAGENTIS_HOSTS: "${RAGENTIS_HOSTS:-localhost 127.0.0.1}"
      RAGENTIS_TLS: "${RAGENTIS_TLS:-internal}"
      RAGENTIS_HTTPS_PORT: "${RAGENTIS_HTTPS_PORT:-8443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - "${RAGENTIS_CERTS_DIR:-./certs}:/certs:ro"
    # 127.0.0.1 = only this computer. Set RAGENTIS_BIND=0.0.0.0 in .env so
    # other office computers can open https://<this-computer>:8443
    ports:
      - "${RAGENTIS_BIND:-127.0.0.1}:${RAGENTIS_HTTPS_PORT:-8443}:443"
      - "${RAGENTIS_BIND:-127.0.0.1}:${RAGENTIS_HTTP_PORT:-8080}:80"

volumes:
  postgres_data:
  ollama_data:
  rag_uploads:
  rag_chroma:
  hf_cache:
  rag_reports:
  caddy_data:
  caddy_config:
